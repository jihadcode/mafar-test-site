<!--
  FILE MAP — reset-password.html
  Uses:  /css/reset-password.css, /css/navbar.css  ← navbar.css is shared by every public page
  JS:    inline <script> at the bottom (form logic)
         /js/navbar.js  ← shared site header/navigation
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password &middot; MAFAR-LDS Portal</title>
<link rel="stylesheet" href="/css/navbar.css">
<link rel="stylesheet" href="/css/reset-password.css">
</head>
<body>
<div id="site-header"></div>
<script src="/js/navbar.js"></script>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <div class="sub" id="subText">Choose a new password for your account.</div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="resetForm">
      <div class="field">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" minlength="6" required>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" required>
      </div>
      <button type="submit" class="btn" style="width:100%;" id="submitBtn">Reset Password</button>
    </form>

    <div class="switch">Remembered it after all? <a href="/login.html">Log in</a></div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const errBox = document.getElementById('errorMsg');
const okBox = document.getElementById('successMsg');

if (!token) {
  document.getElementById('subText').textContent =
    'This page needs a reset link with a token in it.';
  errBox.textContent = 'No reset token found. Please use the link from your password reset request.';
  errBox.style.display = 'block';
  document.getElementById('resetForm').style.display = 'none';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  errBox.style.display = 'none';
  okBox.style.display = 'none';

  if (password !== confirmPassword) {
    errBox.textContent = "Those passwords don't match. Please try again.";
    errBox.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errBox.textContent = data.error || 'Could not reset your password.';
      errBox.style.display = 'block';
      return;
    }
    okBox.textContent = data.message;
    okBox.style.display = 'block';
    document.getElementById('resetForm').style.display = 'none';
    setTimeout(() => { window.location.href = '/login.html'; }, 2000);
  } catch (err) {
    errBox.textContent = 'Could not reach the server. Please try again.';
    errBox.style.display = 'block';
  }
});
</script>

</body>
</html>
